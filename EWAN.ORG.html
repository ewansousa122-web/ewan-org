<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EWAN ORG — Redimensionador</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #080808;
    --surface: #111111;
    --border: #2a0a0a;
    --accent: #e00000;
    --accent2: #ff3333;
    --text: #f0f0f0;
    --muted: #666;
    --success: #e00000;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    gap: 32px;
    border-top: 4px solid var(--accent);
    background-image: radial-gradient(ellipse at 50% 0%, rgba(200,0,0,0.08) 0%, transparent 60%);
  }

  header {
    text-align: center;
    animation: fadeDown 0.6s ease both;
  }

  header h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(2rem, 6vw, 3.5rem);
    letter-spacing: -2px;
    line-height: 1;
  }

  header h1 span { color: var(--accent); }

  header p {
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 8px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 28px;
    width: 100%;
    max-width: 700px;
    animation: fadeUp 0.6s ease both;
  }

  .card:nth-child(2) { animation-delay: 0.1s; }
  .card:nth-child(3) { animation-delay: 0.2s; }
  .card:nth-child(4) { animation-delay: 0.3s; }

  .label {
    font-size: 0.65rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 16px;
    display: block;
  }

  /* CONFIG */
  .config-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
  }

  .config-group label {
    display: block;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .config-group input, .config-group select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 1rem;
    padding: 10px 12px;
    border-radius: 2px;
    outline: none;
    transition: border-color 0.2s;
  }

  .config-group input:focus, .config-group select:focus {
    border-color: var(--accent);
  }

  .config-group input[type="number"] { text-align: center; font-weight: 700; }

  .separator {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    color: var(--muted);
    padding-top: 24px;
  }

  /* QUALIDADE */
  .quality-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 4px;
  }

  input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    height: 4px;
    cursor: pointer;
  }

  #qualLabel {
    font-weight: 700;
    font-size: 1rem;
    color: var(--accent);
    min-width: 40px;
    text-align: right;
  }

  /* DROP ZONE */
  #dropzone {
    border: 2px dashed var(--border);
    border-radius: 4px;
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
  }

  #dropzone.hover {
    border-color: var(--accent);
    background: rgba(220, 0, 0, 0.06);
  }

  #dropzone .icon {
    font-size: 3rem;
    margin-bottom: 12px;
    display: block;
  }

  #dropzone h3 {
    font-family: 'Syne', sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    margin-bottom: 6px;
  }

  #dropzone p { color: var(--muted); font-size: 0.75rem; }

  #fileInput { display: none; }

  /* PREVIEW GRID */
  #previewGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 8px;
    margin-top: 16px;
  }

  .thumb-wrap {
    position: relative;
    aspect-ratio: 1;
    overflow: hidden;
    border-radius: 2px;
    border: 1px solid var(--border);
    background: var(--bg);
    animation: pop 0.3s ease both;
  }

  .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .thumb-wrap .remove {
    position: absolute;
    top: 2px; right: 2px;
    background: var(--accent2);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 18px; height: 18px;
    font-size: 10px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .thumb-wrap:hover .remove { opacity: 1; }

  .thumb-wrap .fname {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.7);
    font-size: 8px;
    padding: 2px 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #ccc;
  }

  /* PROGRESS */
  #progressWrap { display: none; margin-top: 16px; }

  #progressBar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 8px;
  }

  #progressFill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.2s ease;
  }

  #progressText { font-size: 0.7rem; color: var(--muted); text-align: center; }

  /* ACTIONS */
  .actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    flex-wrap: wrap;
  }

  button.btn {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 0.9rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 14px 28px;
    border: none;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.18s ease;
    flex: 1;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }

  .btn-primary:hover { background: #ff2222; transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover { border-color: var(--muted); color: var(--text); }

  /* TOAST */
  #toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--success);
    color: #fff;
    font-weight: 700;
    padding: 12px 28px;
    border-radius: 2px;
    font-size: 0.9rem;
    transition: transform 0.4s ease;
    z-index: 999;
  }

  #toast.show { transform: translateX(-50%) translateY(0); }

  .count-badge {
    background: var(--accent2);
    color: #fff;
    font-size: 0.65rem;
    padding: 2px 8px;
    border-radius: 20px;
    margin-left: 8px;
    font-weight: 700;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pop {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>

<header>
  <h1>EWAN <span>ORG</span></h1>
  <p>Redimensionador de Imagens em Lote</p>
</header>

<!-- CONFIG -->
<div class="card">
  <span class="label">⚙️ Configurações</span>
  <div class="config-grid">
    <div class="config-group">
      <label>Largura (px)</label>
      <input type="number" id="width" value="300" min="1" max="9999">
    </div>
    <div class="separator">×</div>
    <div class="config-group">
      <label>Altura (px)</label>
      <input type="number" id="height" value="300" min="1" max="9999">
    </div>
  </div>

  <div style="margin-top:20px;">
    <label class="label" style="margin-bottom:8px;">Qualidade JPEG</label>
    <div class="quality-row">
      <input type="range" id="quality" min="10" max="100" value="90">
      <span id="qualLabel">90%</span>
    </div>
  </div>

  <div style="margin-top:20px;">
    <div class="config-group">
      <label>Nome da pasta no ZIP</label>
      <input type="text" id="folderName" value="FACAO" placeholder="Ex: FACAO">
    </div>
  </div>
</div>

<!-- DROP / UPLOAD -->
<div class="card">
  <span class="label">📁 Imagens <span id="countBadge" class="count-badge" style="display:none">0</span></span>

  <div id="dropzone">
    <span class="icon">🖼️</span>
    <h3>Arraste as imagens aqui</h3>
    <p>ou clique para selecionar — JPG, PNG, WEBP, JFIF, GIF</p>
    <input type="file" id="fileInput" multiple accept="image/*">
  </div>

  <div id="previewGrid"></div>

  <div id="progressWrap">
    <div id="progressBar"><div id="progressFill"></div></div>
    <p id="progressText">Processando...</p>
  </div>

  <div class="actions">
    <button class="btn btn-secondary" onclick="clearAll()">Limpar tudo</button>
    <button class="btn btn-primary" id="btnProcess" onclick="processImages()" disabled>
      ⬇️ Redimensionar e Baixar ZIP
    </button>
  </div>
</div>

<div id="toast">✅ ZIP baixado com sucesso!</div>

<script>
  const files = [];
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const grid = document.getElementById('previewGrid');
  const btnProcess = document.getElementById('btnProcess');
  const countBadge = document.getElementById('countBadge');

  document.getElementById('quality').addEventListener('input', e => {
    document.getElementById('qualLabel').textContent = e.target.value + '%';
  });

  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => addFiles(e.target.files));

  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('hover'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('hover'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('hover');
    addFiles(e.dataTransfer.files);
  });

  function addFiles(fileList) {
    Array.from(fileList).forEach(f => {
      if (!f.type.startsWith('image/')) return;
      files.push(f);
      const idx = files.length - 1;
      const url = URL.createObjectURL(f);
      const wrap = document.createElement('div');
      wrap.className = 'thumb-wrap';
      wrap.innerHTML = `
        <img src="${url}" alt="">
        <button class="remove" onclick="removeFile(${idx}, this)">✕</button>
        <span class="fname">${f.name}</span>
      `;
      grid.appendChild(wrap);
    });
    updateCount();
  }

  function removeFile(idx, btn) {
    files[idx] = null;
    btn.closest('.thumb-wrap').remove();
    updateCount();
  }

  function clearAll() {
    files.length = 0;
    grid.innerHTML = '';
    updateCount();
  }

  function updateCount() {
    const active = files.filter(f => f !== null).length;
    btnProcess.disabled = active === 0;
    countBadge.style.display = active ? 'inline' : 'none';
    countBadge.textContent = active;
  }

  async function processImages() {
    const w = parseInt(document.getElementById('width').value) || 300;
    const h = parseInt(document.getElementById('height').value) || 300;
    const q = parseInt(document.getElementById('quality').value) / 100;
    const folder = document.getElementById('folderName').value.trim() || 'imagens';

    const active = files.filter(f => f !== null);
    if (active.length === 0) return;

    const progressWrap = document.getElementById('progressWrap');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');

    progressWrap.style.display = 'block';
    btnProcess.disabled = true;

    const zip = new JSZip();
    const folderZip = zip.folder(folder);

    for (let i = 0; i < active.length; i++) {
      const file = active[i];
      progressText.textContent = `Processando ${i + 1} de ${active.length}: ${file.name}`;
      progressFill.style.width = ((i / active.length) * 100) + '%';

      const blob = await resizeImage(file, w, h, q);
      const baseName = file.name.replace(/\.[^.]+$/, '') + '.jpg';
      folderZip.file(baseName, blob);

      await new Promise(r => setTimeout(r, 0)); // yield to UI
    }

    progressFill.style.width = '100%';
    progressText.textContent = 'Gerando ZIP...';

    const content = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(content);
    const a = document.createElement('a');
    a.href = url;
    a.download = folder + '.zip';
    a.click();
    URL.revokeObjectURL(url);

    progressWrap.style.display = 'none';
    progressFill.style.width = '0%';
    btnProcess.disabled = false;

    showToast();
  }

  function resizeImage(file, w, h, quality) {
    return new Promise((resolve) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        canvas.toBlob(resolve, 'image/jpeg', quality);
      };
      img.src = url;
    });
  }

  function showToast() {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }
</script>
</body>
</html>
