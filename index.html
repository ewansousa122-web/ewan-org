<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EWAN ORG — Ferramentas de Imagem</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #080808;
    --surface: #111111;
    --border: #2a0a0a;
    --accent: #e00000;
    --accent2: #ff3333;
    --text: #f0f0f0;
    --muted: #666;
    --success: #e00000;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
    gap: 24px;
    border-top: 4px solid var(--accent);
    background-image: radial-gradient(ellipse at 50% 0%, rgba(200,0,0,0.08) 0%, transparent 60%);
  }

  header { text-align: center; animation: fadeDown 0.6s ease both; }
  header h1 { font-family: 'Syne', sans-serif; font-weight: 800; font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: -2px; line-height: 1; }
  header h1 span { color: var(--accent); }
  header p { color: var(--muted); font-size: 0.75rem; margin-top: 8px; letter-spacing: 3px; text-transform: uppercase; }

  .tabs {
    display: flex; width: 100%; max-width: 700px;
    border: 1px solid var(--border); border-radius: 3px;
    overflow: hidden; animation: fadeUp 0.5s ease both;
  }
  .tab-btn {
    flex: 1; padding: 13px 10px;
    font-family: 'Syne', sans-serif; font-weight: 800;
    font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase;
    background: var(--surface); color: var(--muted);
    border: none; border-right: 1px solid var(--border);
    cursor: pointer; transition: all 0.18s;
  }
  .tab-btn:last-child { border-right: none; }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { background: var(--accent); color: #fff; }

  .tab-panel { display: none; width: 100%; flex-direction: column; align-items: center; gap: 24px; }
  .tab-panel.active { display: flex; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 28px;
    width: 100%; max-width: 700px;
    animation: fadeUp 0.5s ease both;
  }

  .label {
    font-size: 0.65rem; letter-spacing: 3px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 16px; display: block;
  }

  .config-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .config-group label { display: block; font-size: 0.65rem; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
  .config-group input, .config-group select {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); font-family: 'Space Mono', monospace;
    font-size: 1rem; padding: 10px 12px; border-radius: 2px; outline: none; transition: border-color 0.2s;
  }
  .config-group input:focus, .config-group select:focus { border-color: var(--accent); }
  .config-group input[type="number"] { text-align: center; font-weight: 700; }
  .separator { display: flex; align-items: center; justify-content: center; font-size: 1.4rem; color: var(--muted); padding-top: 24px; }

  .quality-row { display: flex; align-items: center; gap: 16px; margin-top: 4px; }
  input[type="range"] { flex: 1; accent-color: var(--accent); height: 4px; cursor: pointer; }
  #qualLabel { font-weight: 700; font-size: 1rem; color: var(--accent); min-width: 40px; text-align: right; }

  #dropzone {
    border: 2px dashed var(--border); border-radius: 4px; padding: 48px 24px;
    text-align: center; cursor: pointer; transition: all 0.25s ease; position: relative;
  }
  #dropzone.hover { border-color: var(--accent); background: rgba(220,0,0,0.06); }
  #dropzone .icon { font-size: 3rem; margin-bottom: 12px; display: block; }
  #dropzone h3 { font-family: 'Syne', sans-serif; font-size: 1.3rem; font-weight: 700; margin-bottom: 6px; }
  #dropzone p { color: var(--muted); font-size: 0.75rem; }
  #fileInput { display: none; }

  #previewGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; margin-top: 16px; }
  .thumb-wrap { position: relative; aspect-ratio: 1; overflow: hidden; border-radius: 2px; border: 1px solid var(--border); background: var(--bg); animation: pop 0.3s ease both; }
  .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb-wrap .remove { position: absolute; top: 2px; right: 2px; background: var(--accent2); color: #fff; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; }
  .thumb-wrap:hover .remove { opacity: 1; }
  .thumb-wrap .fname { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); font-size: 8px; padding: 2px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ccc; }

  #progressWrap { display: none; margin-top: 16px; }
  #progressBar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 8px; }
  #progressFill { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s ease; }
  #progressText { font-size: 0.7rem; color: var(--muted); text-align: center; }

  .actions { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  button.btn {
    font-family: 'Syne', sans-serif; font-weight: 800; font-size: 0.9rem;
    letter-spacing: 1px; text-transform: uppercase; padding: 14px 28px;
    border: none; border-radius: 2px; cursor: pointer; transition: all 0.18s ease; flex: 1;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #ff2222; transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--muted); color: var(--text); }
  .count-badge { background: var(--accent2); color: #fff; font-size: 0.65rem; padding: 2px 8px; border-radius: 20px; margin-left: 8px; font-weight: 700; }

  #bgDropzone {
    border: 2px dashed var(--border); border-radius: 4px; padding: 48px 24px;
    text-align: center; cursor: pointer; transition: all 0.25s ease;
  }
  #bgDropzone.hover { border-color: var(--accent); background: rgba(220,0,0,0.06); }
  #bgDropzone .icon { font-size: 3rem; margin-bottom: 12px; display: block; }
  #bgDropzone h3 { font-family: 'Syne', sans-serif; font-size: 1.3rem; font-weight: 700; margin-bottom: 6px; }
  #bgDropzone p { color: var(--muted); font-size: 0.75rem; }
  #bgFileInput { display: none; }

  .colors-title { font-size: 0.6rem; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; margin-top: 18px; display: block; }
  .swatch-row { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
  .swatch { width: 30px; height: 30px; border-radius: 2px; border: 2px solid #2a0000; cursor: pointer; transition: transform 0.15s, border-color 0.15s; flex-shrink: 0; }
  .swatch:hover { transform: scale(1.2); }
  .swatch.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(224,0,0,0.3); }
  .swatch-transp { background: repeating-conic-gradient(#333 0% 25%, #1a1a1a 0% 50%) 0 0/14px 14px; }
  .custom-wrap { position: relative; width: 30px; height: 30px; }
  .custom-wrap input[type=color] { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: none; padding: 0; }
  .custom-prev { width: 30px; height: 30px; border-radius: 2px; border: 2px dashed #555; pointer-events: none; display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--muted); }
  .grad-row { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 8px; }
  .grad-swatch { width: 46px; height: 30px; border-radius: 2px; border: 2px solid #2a0000; cursor: pointer; transition: transform 0.15s, border-color 0.15s; }
  .grad-swatch:hover { transform: scale(1.1); }
  .grad-swatch.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(224,0,0,0.3); }
  .bg-preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
  .bg-box { border: 1px solid var(--border); border-radius: 2px; padding: 12px; text-align: center; }
  .bg-box-label { font-size: 0.58rem; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; display: block; }
  .bg-box img, .bg-box canvas { max-width: 100%; max-height: 200px; display: block; margin: 0 auto; border-radius: 2px; }
  .bg-box.highlight { border-color: var(--accent); }
  #bgStatus { font-size: 0.7rem; color: var(--muted); margin-top: 14px; min-height: 18px; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
  .spinner { width: 12px; height: 12px; border: 2px solid #2a0000; border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
  .spinner.on { display: inline-block; }

  #toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--success); color: #fff; font-family: 'Syne', sans-serif; font-weight: 700; padding: 12px 28px; border-radius: 2px; font-size: 0.9rem; transition: transform 0.4s ease; z-index: 999; white-space: nowrap; }
  #toast.show { transform: translateX(-50%) translateY(0); }
  footer { font-size: 0.6rem; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }

  @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pop { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>EWAN <span>ORG</span></h1>
  <p>Ferramentas de Imagem</p>
</header>

<div class="tabs">
  <button class="tab-btn active" id="tabResize" onclick="switchTab('resize')">⚙️ Redimensionar</button>
  <button class="tab-btn" id="tabBg" onclick="switchTab('bg')">✂ Remover Fundo</button>
</div>

<div class="tab-panel active" id="panelResize">
  <div class="card">
    <span class="label">⚙️ Configurações</span>
    <div class="config-grid">
      <div class="config-group">
        <label>Largura (px)</label>
        <input type="number" id="width" value="300" min="1" max="9999">
      </div>
      <div class="separator">×</div>
      <div class="config-group">
        <label>Altura (px)</label>
        <input type="number" id="height" value="300" min="1" max="9999">
      </div>
    </div>
    <div style="margin-top:20px;">
      <label class="label" style="margin-bottom:8px;">Qualidade JPEG</label>
      <div class="quality-row">
        <input type="range" id="quality" min="10" max="100" value="90">
        <span id="qualLabel">90%</span>
      </div>
    </div>
    <div style="margin-top:20px;">
      <div class="config-group">
        <label>Nome da pasta no ZIP</label>
        <input type="text" id="folderName" value="FACAO" placeholder="Ex: FACAO">
      </div>
    </div>
  </div>
  <div class="card">
    <span class="label">📁 Imagens <span id="countBadge" class="count-badge" style="display:none">0</span></span>
    <div id="dropzone">
      <span class="icon">🖼️</span>
      <h3>Arraste as imagens aqui</h3>
      <p>ou clique para selecionar — JPG, PNG, WEBP, JFIF, GIF</p>
      <input type="file" id="fileInput" multiple accept="image/*">
    </div>
    <div id="previewGrid"></div>
    <div id="progressWrap">
      <div id="progressBar"><div id="progressFill"></div></div>
      <p id="progressText">Processando...</p>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" onclick="clearAll()">Limpar tudo</button>
      <button class="btn btn-primary" id="btnProcess" onclick="processImages()" disabled>⬇️ Redimensionar e Baixar ZIP</button>
    </div>
  </div>
</div>

<div class="tab-panel" id="panelBg">
  <div class="card">
    <span class="label">✂ Remover &amp; Trocar Fundo com IA</span>
    <div id="bgDropzone">
      <span class="icon">🖼️</span>
      <h3>Arraste sua imagem aqui</h3>
      <p>ou clique para selecionar — JPG, PNG, WEBP</p>
      <input type="file" id="bgFileInput" accept="image/*">
